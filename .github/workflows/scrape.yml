name: Scrape

on:
  push:
  workflow_dispatch:
  schedule:
  # Daily at 6:23 AM UTC
  - cron: '23 6 * * *'
  # For hourly at 42 minutes past the hour: '42 * * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.is_template }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: "pip"
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    - name: Install Chrome and Xvfb
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        # google-chrome-stable is normally pre-installed on ubuntu-latest; make
        # sure it (or chromium) is present for nodriver to drive.
        if ! command -v google-chrome >/dev/null 2>&1; then
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
        fi
        google-chrome --version || chromium --version || chromium-browser --version || true
    - name: Run the scraper
      run: |
        ./scrape.sh
    - name: Commit and push
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "${timestamp}" || exit 0
        git pull --rebase
        git push
